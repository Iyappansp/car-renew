<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RenewPath</title>
<meta name="description" content="Log in to RenewPath to access your policies, renewal reminders, documents and quotes.">
<meta name="robots" content="noindex">
<link rel="canonical" href="login.html">
<link rel="icon" href="assets/images/favicons.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
<div class="auth-vertical-shell">

  <!-- Top Navigation Header -->
  <header class="auth-vertical-header">
    <div class="auth-top-toggles">
      <button type="button" class="toggle-btn" id="theme-toggle-standalone" aria-label="Toggle dark mode">
        <span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
      <button type="button" class="rtl-text-btn" id="rtl-toggle-standalone" aria-label="Toggle right-to-left layout">RTL</button>
    </div>
  </header>

  <!-- Vertical Centered Card -->
  <main class="auth-vertical-main">
    <div class="auth-vertical-card card">
      <div class="auth-card-header">
        <div class="auth-card-logo-wrap">
          <a href="index.html" class="brand" aria-label="RenewPath Home">
            <img src="assets/images/logo1.png" alt="RenewPath" class="auth-card-logo-img">
          </a>
        </div>
        <h1 class="h2">Welcome back</h1>
        <p class="text-muted">Access your policies, renewal reminders and quotes</p>
      </div>

      <!-- Form First -->
      <form id="login-form" novalidate>
        <div class="field">
          <label for="li-email">Email or mobile number</label>
          <input type="text" id="li-email" class="input" placeholder="you@example.com" required autocomplete="username">
          <span class="error-text" id="li-email-error">Enter a valid email or mobile number.</span>
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <div class="input-group">
            <input type="password" id="li-password" class="input" placeholder="Enter your password" required minlength="6" autocomplete="current-password">
            <button type="button" class="input-suffix-btn" data-password-toggle="li-password" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="error-text" id="li-password-error">Password must be at least 6 characters.</span>
        </div>
        <div class="flex justify-between items-center" style="margin-top:4px;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <label class="checkbox-row" style="margin-bottom:0;font-size:0.80rem"><input type="checkbox" checked> Remember me</label>
          <a href="forgot-password.html" style="font-size:0.80rem;color:var(--color-primary);font-weight:600">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or continue with</span></div>

      <!-- Social Login Buttons: Google, Facebook, Apple at the LAST of container -->
      <div class="auth-social-row">
        <button type="button" class="auth-social-btn" id="login-google-btn" aria-label="Sign in with Google">
          <svg width="15" height="15" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.29 21.43 7.37 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.94 0 12c0 2.06.46 3.84 1.26 5.42l4.02-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.29 2.57 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="auth-social-btn" id="login-facebook-btn" aria-label="Sign in with Facebook">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>Facebook</span>
        </button>

        <button type="button" class="auth-social-btn" id="login-apple-btn" aria-label="Sign in with Apple">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1.01.08 2.03-.49 2.65-1.24z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <p class="auth-switch-link text-muted">
        Don't have an account? <a href="signup.html" style="color:var(--color-primary);font-weight:600">Create an account</a>
      </p>
    </div>
  </main>

  <!-- Bottom Badges & Footer -->
  
</div>

<script src="assets/js/main.js"></script>
<script src="assets/js/animations.js"></script>
<script>
  // Standalone Theme toggle
  document.getElementById('theme-toggle-standalone').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('rp-theme', next);
  });

  // Standalone RTL toggle
  document.getElementById('rtl-toggle-standalone').addEventListener('click', function () {
    var isRTL = document.documentElement.getAttribute('dir') === 'rtl';
    document.documentElement.setAttribute('dir', isRTL ? 'ltr' : 'rtl');
    localStorage.setItem('rp-rtl', isRTL ? '0' : '1');
  });

  // Social login buttons simulation
  ['login-google-btn', 'login-facebook-btn', 'login-apple-btn'].forEach(function(id) {
    var btn = document.getElementById(id);
    if (btn) {
      btn.addEventListener('click', function() {
        var provider = id.replace('login-', '').replace('-btn', '');
        provider = provider.charAt(0).toUpperCase() + provider.slice(1);
        if (window.RenewPath && window.RenewPath.toast) {
          window.RenewPath.toast('Connecting to ' + provider + '...');
        }
        setTimeout(function() {
          window.location.href = 'dashboard/index.html';
        }, 1100);
      });
    }
  });

  // Login form validation
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('li-email');
    var pass = document.getElementById('li-password');
    var valid = true;
    if (!email.value.trim()) {
      email.classList.add('is-invalid');
      document.getElementById('li-email-error').classList.add('show');
      valid = false;
    } else {
      email.classList.remove('is-invalid');
      document.getElementById('li-email-error').classList.remove('show');
    }
    if (pass.value.length < 6) {
      pass.classList.add('is-invalid');
      document.getElementById('li-password-error').classList.add('show');
      valid = false;
    } else {
      pass.classList.remove('is-invalid');
      document.getElementById('li-password-error').classList.remove('show');
    }
    if (!valid) return;

    var btn = this.querySelector('button[type="submit"]');
    btn.textContent = 'Logging in…';
    btn.disabled = true;
    setTimeout(function () { window.location.href = 'dashboard/index.html'; }, 850);
  });
</script>
</body>
</html>
